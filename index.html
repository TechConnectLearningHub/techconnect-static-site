<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- ============================================
         META: Document Encoding & Viewport Settings
         ============================================ -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TechConnect Learning Hub is a community-driven ICT learning initiative for practical digital and enterprise skills." />
    
    <!-- ============================================
         PAGE TITLE & BRANDING
         ============================================ -->
    <title>TechConnect Learning Hub</title>
    
    <!-- ============================================
         STYLESHEET: Main CSS Styles
         ============================================ -->
    <link rel="stylesheet" href="./resources/css/style.css?v=3" />
  </head>
  <body>
    <!-- ============================================
         HEADER: Navigation Bar & Logo
         ============================================ -->
    <header>
      <div class="container nav">
        <!-- Brand Logo & Text -->
        <a class="brand" href="#home">
          <img src="./resources/images/techconnect-logo.jpg" alt="TechConnect Learning Hub logo" />
          <div class="brand-text">
            <div class="brand-title">
              <span class="tech-dark">Tech</span><span class="tech-blue">Connect</span>
            </div>
            <div class="brand-subtitle">Learning Hub</div>
          </div>
        </a>

        <!-- Main Navigation Menu -->
        <nav>
          <a class="active" href="#home">Home</a>
          <a href="#mission" onclick="openSection('mission')">Mission</a>
          <a href="#values" onclick="openSection('values')">Values</a>
          <a href="#areas">Areas</a>
          <a href="#topics" onclick="openSection('topics')">Topics</a>
          <a href="#approach" onclick="openSection('approach')">Approach</a>
          <a href="#audience" onclick="openSection('audience')">Audience</a>
          <a href="#team" onclick="openSection('team')">Team</a>
          <a href="#partners" onclick="openSection('partners')">Partners</a>
          <a href="#contact" onclick="openSection('contact')">Contact</a>
        </nav>

        <!-- Mobile Menu Toggle Button -->
        <button class="mobile-menu-btn" onclick="toggleMobileMenu()" aria-label="Open menu">
          ☰
        </button>

        <!-- Header CTA Button -->
        <a class="header-cta" href="javascript:void(0)" onclick="openSection('contact')">Contact Us</a>
      </div>
    </header>

    <!-- ============================================
         MOBILE MENU: Side Navigation
         ============================================ -->
    <div class="mobile-menu" id="mobileMenu">
      <button class="mobile-close" onclick="toggleMobileMenu()">×</button>
      <a href="#home" onclick="toggleMobileMenu()">Home</a>
      <a href="javascript:void(0)" onclick="openSection('mission'); toggleMobileMenu()">Mission</a>
      <a href="javascript:void(0)" onclick="openSection('values'); toggleMobileMenu()">Values</a>
      <a href="#areas" onclick="toggleMobileMenu()">Areas</a>
      <a href="javascript:void(0)" onclick="openSection('topics'); toggleMobileMenu()">Topics</a>
      <a href="javascript:void(0)" onclick="openSection('team'); toggleMobileMenu()">Team</a>
      <a href="javascript:void(0)" onclick="openSection('partners'); toggleMobileMenu()">Partners</a>
      <a href="javascript:void(0)" onclick="openSection('contact'); toggleMobileMenu()">Contact</a>
    </div>

    <!-- ============================================
         MAIN CONTENT: Dynamic Sections
         ============================================ -->
    <main id="home">
      <!-- Hero Section with Cover Image -->
      <section class="hero">
        <div class="hero-image" aria-label="TechConnect community learning cover image"></div>
      </section>

      <!-- Dynamic Section Containers -->
      <!-- These are populated by main.js from /resources/sections/ folder -->
      <div id="areas-section"></div>
      <div id="mission-section"></div>
      <div id="values-section"></div>
      <div id="approach-section"></div>
      <div id="audience-section"></div>
      <div id="topics-section"></div>
      <div id="team-section"></div>
      <div id="partners-section"></div>
      <div id="contact-section"></div>
      

      <!-- JavaScript: Main Application Logic -->
      <script src="./resources/js/main.js?v=3"></script>
    </main>

    <!-- ============================================
         FOOTER: Copyright & Branding
         ============================================ -->
    <footer>
      <div class="container footer-inner">
        <div>© 2026 TechConnect Learning Hub</div>
        <div>Learn. Connect. Grow.</div>
      </div>
    </footer>
  </body>
</html>

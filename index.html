<!DOCTYPE html>
<html lang="en">

<head>

  <!-- =====================================================
       CHARACTER ENCODING
  ====================================================== -->
  <!-- Ensures proper text rendering across browsers -->
  <meta charset="UTF-8" />

  <!-- =====================================================
       MOBILE RESPONSIVE VIEWPORT
  ====================================================== -->
  <!-- Makes the layout responsive on phones and tablets -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0" />

  <!-- =====================================================
       SEO DESCRIPTION
  ====================================================== -->
  <!-- Helps search engines understand website purpose -->
  <meta name="description"
        content="TechConnect Learning Hub is a community-driven ICT learning initiative for practical digital and enterprise skills." />

  <!-- =====================================================
       PAGE TITLE
  ====================================================== -->
  <!-- Displayed in browser tabs and search results -->
  <title>TechConnect Learning Hub</title>

  <!-- =====================================================
       CANONICAL URL
  ====================================================== -->
  <!-- Defines the primary URL for search engines -->
  <link rel="canonical"
        href="https://techconnectlearninghub.github.io/techconnect-static-site/" />

  <!-- =====================================================
       OPEN GRAPH META TAGS
  ====================================================== -->
  <!-- Improves social media sharing previews -->
  <meta property="og:title"
        content="TechConnect Learning Hub" />

  <meta property="og:description"
        content="Community-driven ICT learning initiative for practical digital and enterprise skills." />

  <meta property="og:type"
        content="website" />

  <meta property="og:url"
        content="https://techconnectlearninghub.github.io/techconnect-static-site/" />

  <meta property="og:image"
        content="https://techconnectlearninghub.github.io/techconnect-static-site/resources/images/webp/techconnect-cover.webp" />
  

  <!-- =====================================================
      TWITTER / X SOCIAL META TAGS
  ====================================================== -->
  <!-- Improves link previews on X (Twitter) -->
  <meta name="twitter:card"
        content="summary_large_image" />

  <meta name="twitter:title"
        content="TechConnect Learning Hub" />

  <meta name="twitter:description"
        content="Community-driven ICT learning initiative for practical digital and enterprise skills." />

  <meta name="twitter:image"
        content="https://techconnectlearninghub.github.io/techconnect-static-site/resources/images/webp/techconnect-cover.webp" />      

  <!-- =====================================================
       STRUCTURED DATA (JSON-LD)
  ====================================================== -->
  <!-- Helps search engines and AI systems understand
       the website as an educational organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "EducationalOrganization",

    "name": "TechConnect Learning Hub",

    "url": "https://techconnectlearninghub.github.io/techconnect-static-site/",

    "logo": "https://techconnectlearninghub.github.io/techconnect-static-site/resources/images/webp/techconnect-logo.webp",

    "description": "Community-driven ICT learning initiative focused on practical digital and enterprise skills.",

    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Melbourne",
      "addressCountry": "Australia"
    },

    "sameAs": [
      "https://github.com/TechConnectLearningHub"
    ]
  }
  </script>

  <!-- =====================================================
       PERFORMANCE: HERO IMAGE PRELOAD
  ====================================================== -->
  <!-- Preloads the hero banner image early to improve
       Largest Contentful Paint (LCP) performance -->
  <link rel="preload"
        as="image"
        href="./resources/images/webp/techconnect-cover.webp" />

  <!-- =====================================================
       MAIN STYLESHEET
  ====================================================== -->
  <!-- Loads all website styling -->
  <link rel="stylesheet"
        href="./resources/css/style.css" />

</head>

<body>

  <!-- =====================================================
       HEADER / TOP NAVIGATION
  ====================================================== -->
  <header>

    <div class="container nav">

      <!-- ===============================================
           BRAND / LOGO
      ================================================ -->
      <a class="brand" href="#home">

        <!-- Logo image -->
        <img src="./resources/images/webp/techconnect-logo.webp"
             alt="TechConnect Learning Hub logo" />

        <!-- Brand text -->
        <div class="brand-text">

          <!-- Main title -->
          <div class="brand-title">
            <span class="tech-dark">Tech</span>
            <span class="tech-blue">Connect</span>
          </div>

          <!-- Subtitle -->
          <div class="brand-subtitle">
            Learning Hub
          </div>

        </div>

      </a>

      <!-- ===============================================
           DESKTOP NAVIGATION MENU
      ================================================ -->
      <!-- ===============================================
     DESKTOP NAVIGATION MENU
================================================ -->
    <nav>

      <!-- ===========================================
          HOME
      ============================================ -->
      <a class="active"
        href="#home">

        Home

      </a>

      <!-- ===========================================
          ABOUT
      ============================================ -->
      <!-- Combines:
          - Mission
          - Values
          - Approach
          - Audience -->
      <a href="#mission"
        data-section="mission">

        About

      </a>

      <!-- ===========================================
          EXPLORE SKILLS
      ============================================ -->
      <!-- Combines:
          - Areas
          - Topics -->
      <a href="#areas">

        Explore Skills

      </a>

     <!-- ===========================================
     RESOURCES DROPDOWN
        ============================================ -->
        <!--
          Replaces the old accordion-based Resources section
          with a modern dropdown navigation menu.

          Purpose:
          - Cleaner UX
          - Scalable navigation architecture
          - Better separation of content
          - Allows dedicated standalone pages

          Future pages:
          - FAQ
          - Blog
          - Learning Guides
          - Workshops
          - Community Resources
        -->
        <div class="nav-dropdown">

          <!-- =======================================
              DROPDOWN TRIGGER
          ======================================== -->
          <!--
            Main clickable navigation item.

            The ▾ symbol indicates
            expandable dropdown content.
          -->
          <a href="#"
            class="nav-dropdown-trigger">

            Resources ▾

          </a>

          <!-- =======================================
              DROPDOWN MENU
          ======================================== -->
          <!--
            Contains links to standalone resource pages.

            These pages are NOT loaded dynamically
            like accordion sections.

            They open as independent pages.
          -->
          <div class="nav-dropdown-menu">

            <!-- FAQ PAGE -->
            <a href="./resources/pages/faq.html">

              FAQ

            </a>

            <!-- BLOG PAGE -->
            <a href="./resources/pages/blog.html">

              Blog

            </a>

            <!-- LEARNING GUIDES PAGE -->
            <a href="./resources/pages/learning-guides.html">

              Learning Guides

            </a>

            <!-- WORKSHOPS PAGE -->
            <a href="./resources/pages/workshops.html">

              Workshops

            </a>

            <!-- COMMUNITY RESOURCES PAGE -->
            <a href="./resources/pages/community-resources.html">

              Community Resources

            </a>

          </div>

        </div>
      

      <!-- ===========================================
          COMMUNITY
      ============================================ -->
      <!-- Combines:
          - Team
          - Partners
          - Volunteer -->
      <a href="#team"
        data-section="team">

        Community

      </a>

      <!-- ===========================================
          CONTACT
      ============================================ -->
      <a href="#contact"
        data-section="contact">

        Contact

      </a>

    </nav>

      <!-- ===============================================
           MOBILE MENU BUTTON
      ================================================ -->
      <!-- Hamburger icon -->
      <button class="mobile-menu-btn"
              type="button"
              aria-label="Open menu"
              data-mobile-menu-toggle>

        ☰

      </button>

      <!-- ===============================================
           HEADER CTA BUTTON
      ================================================ -->
      <!-- Opens contact accordion -->
      <a class="header-cta"
         href="#contact"
         data-section="contact">

        Contact Us

      </a>

    </div>

  </header>

  <!-- =====================================================
       MOBILE SIDE MENU
  ====================================================== -->
  <div class="mobile-menu"
       id="mobileMenu">

    <!-- Close button -->
    <button class="mobile-close"
            type="button"
            aria-label="Close menu"
            data-mobile-menu-toggle>

      ×

    </button>

    <!-- Mobile navigation links -->
    <a href="#home"
      data-mobile-close>

      Home

    </a>

    <a href="#mission"
      data-section="mission"
      data-mobile-close>

      About

    </a>

    <a href="#areas"
      data-mobile-close>

      EXPLORE SKILLS

    </a>

    <a href="#resources"
      data-section="resources"
      data-mobile-close>

      Resources

    </a>

    <a href="#team"
      data-section="team"
      data-mobile-close>

      Community

    </a>

    <a href="#contact"
      data-section="contact"
      data-mobile-close>

      Contact

    </a>

  </div>

  <!-- =====================================================
       MAIN WEBSITE CONTENT
  ====================================================== -->
  <main id="home">

    <!-- ===============================================
         HERO SECTION / COVER IMAGE
    ================================================ -->
    <section class="hero">

      <div class="hero-image"
           aria-label="TechConnect community learning cover image">
      </div>

    </section>

    <!-- ===============================================
         DYNAMICALLY LOADED HTML SECTIONS
    ================================================ -->
    <!--
      These placeholder divs are populated
      dynamically by main.js using fetch()
    -->

    <div id="areas-section"></div>

    <div id="mission-section"></div>

    <div id="values-section"></div>

    <div id="approach-section"></div>

    <div id="audience-section"></div>

    <div id="topics-section"></div>

    <div id="team-section"></div>

    <div id="partners-section"></div>

    <div id="contact-section"></div>

  </main>

  <!-- =====================================================
       FOOTER
  ====================================================== -->
  <footer>

    <div class="container footer-inner">

      <!-- Copyright -->
      <div>
        © 2026 TechConnect Learning Hub
      </div>

      <!-- Motto -->
      <div>
        Learn. Connect. Grow.
      </div>

    </div>

  </footer>

  <!-- =====================================================
       MAIN JAVASCRIPT FILE
  ====================================================== -->
  <!--
    Handles:
    - Dynamic section loading
    - Accordions
    - Navigation logic
    - Mobile menu
  -->
  <script src="./resources/js/main.js?v=3"></script>

</body>

</html>
